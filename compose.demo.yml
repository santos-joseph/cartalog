services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartalog
      POSTGRES_PASSWORD: ${CARTALOG_DEMO_DB_PASSWORD:?Run node scripts/demo.mjs setup first}
      POSTGRES_DB: cartalog_demo
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - cartalog_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartalog -d cartalog_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cartalog_demo_data:
